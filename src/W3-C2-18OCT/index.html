<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Patient Management - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #2c3e50;
            background-color: #ffffff;
            line-height: 1.5;
            padding: 24px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .main-header {
            margin-bottom: 24px;
        }

        .main-title {
            color: #4b8b6f;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .btn-primary {
            background-color: #559678;
            color: #ffffff;
            border: 1px solid #437d63;
        }

        .btn-primary:hover {
            background-color: #458066;
        }

        .table-container {
            margin-top: 24px;
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .data-table th {
            text-align: left;
            padding: 12px 14px;
            font-weight: 700;
            color: #1a1a1a;
            border-bottom: 2px solid #e2e8f0;
            border-top: 1px solid #e2e8f0;
        }

        .data-table td {
            padding: 12px 14px;
            color: #4a5568;
            border-bottom: 1px solid #edf2f7;
        }

        .data-table tbody tr:hover {
            background-color: #f8fafc;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Main Application Title -->
        <header class="main-header">
            <h1 class="main-title">Diabetes Patient Management</h1>
        </header>

        <!-- Encounter Management Section -->
        <main>
            <div class="section-header">
                <h2 class="section-title">Patient Encounters</h2>
                <a href="add-encounter.html" class="btn btn-primary">+ Add Patient Encounter</a>
            </div>

            <!-- Patient Encounter List Table -->
            <section class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Patient Number</th>
                            <th>Age</th>
                            <th>Time in Hospital (days)</th>
                            <th>Inpatient Visits</th>
                            <th>Emergency Visits</th>
                            <th>Medications</th>
                        </tr>
                    </thead>
                    <tbody id="encounter-rows">
                        <!-- Rows will be generated by JavaScript from API -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <script>
        // Step 1: API Call function (converted from TypeScript to JavaScript)
        async function fetchEncounters(limit = 10) {
            const url = `http://localhost:8000/encounters?limit=${limit}`;
            try {
                console.log(`Fetching encounters list from ${url}`);
                const response = await fetch(url)
                if (!response.ok) {
                    throw new Error(`Api call failed with status : ${response.status}`);
                }
                const data = await response.json();
                console.log(`API returned ${data?.length || 0}encounters`);
                renderTable(data);
            } catch (err) {
                console.log(err);
            }

            function renderTable(encounters) {
                const tbody = document.querySelector("#encounter-rows");
                if (!tbody) {
                    console.error("Encounter rows element not found");
                    return;
                }
                tbody.innerHTML = "";
                encounters.forEach(encounter => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                    <td>${encounter.patient_nbr}</td>
                    <td>${encounter.age}</td>
                    <td>${encounter.time_in_hospital}</td>
                    <td>${encounter.number_inpatient}</td>
                    <td>${encounter.number_emergency}</td>
                    <td>${encounter.num_medications}</td>
                    `;
                    tbody.appendChild(row);
                });
            }
        }
        // 3. Trigger fetch when the HTML finishes loading
        document.addEventListener("DOMContentLoaded", () => {
            fetchEncounters(5);
        });

    </script>
</body>

</html>
